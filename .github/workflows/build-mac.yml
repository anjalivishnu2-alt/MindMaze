name: Build MindMaze for Mac

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-mac-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-mac-

      - name: Build for macOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildName: MindMaze
          unityVersion: 6000.0.85f1

      - name: Zip the .app
        run: |
          cd build/StandaloneOSX
          zip -r MindMaze-Mac.zip MindMaze.app

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: MindMaze-Mac
          path: build/StandaloneOSX/MindMaze-Mac.zip
          retention-days: 14
